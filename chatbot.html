<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Bootstrap Chatbot</title>
 <link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<link rel="stylesheet" href="./assets/css/custom.css"></link>
 <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body>
 <div class="container py-5">
   <div class="card" style="border-radius: 15px;">
     <div class="card-header bg-primary text-white text-center">
       <h5>Chatbot</h5>
     </div>
     <div class="card-body" style="height: 400px; overflow-y: auto;">
       <!-- Chat messages -->
       <div class="d-flex mb-3">
         <div class="p-3 bg-light rounded">Hello! How can I assist you today?</div>
       </div>
       <div class="d-flex justify-content-end mb-3">
         <div class="p-3 bg-primary text-white rounded">I need help with my account.</div>
       </div>
     </div>
     <div class="card-footer">
       <form id="chat-form">
         <div class="input-group">
           <input type="text" class="form-control" placeholder="Type your message..." required>
           <button type="submit" class="btn btn-primary">Send</button>
         </div>
       </form>
     </div>
   </div>
 </div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
